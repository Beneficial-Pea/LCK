services:
  - type: web
    name: first-team-life
    runtime: docker
    plan: starter
    numInstances: 1
    disk:
      name: first-team-data
      mountPath: /data
      sizeGB: 1
    branch: main
    healthCheckPath: /healthz
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: DATA_FILE
        value: /data/game.sqlite
      - key: SAVE_PERSISTENCE
        value: persistent
      - key: FIRST_TEAM_ADMIN_INVITE
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
