services:
  - type: web
    name: first-team-life
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: DATA_FILE
        value: /tmp/first-team/game.sqlite
      - key: SAVE_PERSISTENCE
        value: ephemeral
      - key: FIRST_TEAM_ADMIN_INVITE
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
