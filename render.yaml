services:
  - type: web
    name: first-team-life
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: DATA_FILE
        value: /tmp/first-team/game.sqlite
      - key: SAVE_PERSISTENCE
        value: ephemeral
